<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1230" />
  <meta name="description" content="Hamster Tales: The Great Seed Adventure - a cozy 2D platformer about a tiny hamster on a big adventure." />
  <title>Hamster Tales: The Great Seed Adventure</title>
  <!-- Loaded asynchronously: if the CDN is slow or blocked the game still starts
       immediately and falls back to the system font stack. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #120c22;
      font-family: 'Nunito', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
      overscroll-behavior: none;
    }
    #app {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(circle at 50% 0%, #3a2a5e 0%, #1b1230 45%, #0d0818 100%);
    }
    #app canvas {
      display: block;
      image-rendering: auto;
      box-shadow: 0 24px 70px rgba(0,0,0,0.65);
      touch-action: none;
    }
    #boot-splash {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #120c22; color: #ffe9b8;
      transition: opacity .45s ease;
      font-family: 'Nunito', system-ui, sans-serif;
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
    #boot-splash .t { font-size: 22px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
    #boot-splash .b { width: 180px; height: 6px; border-radius: 99px; background: #2c2048; overflow: hidden; }
    #boot-splash .b i { display: block; height: 100%; width: 40%; border-radius: 99px;
      background: linear-gradient(90deg, #ffcf5c, #ff9d4d); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    #err {
      position: fixed; inset: auto 16px 16px 16px; z-index: 99;
      background: #2a1030; color: #ffd9e6; border: 1px solid #6b2a55;
      border-radius: 12px; padding: 12px 14px; font-size: 13px; display: none;
      max-height: 40vh; overflow: auto; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot-splash">
    <div class="t">Hamster Tales</div>
    <div class="b"><i></i></div>
  </div>
  <div id="err"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
